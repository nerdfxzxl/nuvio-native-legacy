name: P6 lifecycle and post-play verification (tests only - no APK)

# Dedicated P6 test-only workflow, reusing the accepted P5 regression harness.
# No APK assembly or existing workflow modifications.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/official-stream-selector
    paths:
      - .github/workflows/p6-lifecycle-test-only.yml

permissions:
  contents: read

concurrency:
  group: p6-lifecycle-test-only-feature-branch
  cancel-in-progress: false # Preserve the prior verification while this revision queues.

jobs:
  verify:
    name: Native playback regressions, API35 / Media3 compile and actual PCM replay
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4

      - name: Verify exact CI input
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "P6 exact CI input: $GITHUB_SHA"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Execute original-language, native audio/video error and first-frame C regressions
        shell: bash
        run: |
          set -euo pipefail
          bash tests/audioescolha.sh
          bash tests/audioerro_p5a.sh
          bash tests/audio_foco_android.sh
          bash tests/videoerro_p5b.sh
          bash tests/playback_p2_timing.sh
          bash tests/playback_p2d_handoff.sh
          bash tests/reconexao.sh

      - name: Q45 native chapter provenance, profile journal and actual resume proof regressions
        shell: bash
        run: |
          set -euo pipefail
          SANITIZE=0 bash tests/capmkv.sh
          SANITIZE=0 bash tests/intro.sh
          bash tests/contapend.sh
          bash tests/progresso.sh

      - name: Install Android NDK and host SDL headers for syntax-only C/JNI source check
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev ffmpeg
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          # Expand this test-only invocation to cover changed P6 modules that
          # the ordinary APK preflight does not list. Leave the existing script
          # and every APK workflow unchanged.
          p6_preflight="$(mktemp tools/android/p6-preflight.XXXXXX.sh)"
          trap 'rm -f "$p6_preflight"' EXIT
          sed 's@src/main.c src/home.c src/streams.c@src/plugins.c src/addons.c src/fontecache.c src/fontevolta.c src/fontepref.c src/partes.c src/legextras.c src/proximopreparo.c src/posplay.c src/continuar.c src/atividade.c src/contapend.c src/capmkv.c src/mkv.c src/main.c src/home.c src/streams.c@' tools/android/preflight-c.sh > "$p6_preflight"
          bash "$p6_preflight"
          bash tests/contalib.sh
          # Includes exact bounded stream/CW identity composition regressions.
          # P6 exact title/pair/wire ownership after catalogue replacement.
          bash tests/catalog_episode_identity512.sh
          C_INCLUDE_PATH=/usr/include/SDL2 bash tests/cwfrente.sh
          cc -std=gnu11 -O1 -Isrc src/js.c tests/p6_exact_id.c -lm -o /tmp/p6-exact-id && /tmp/p6-exact-id
          cc -std=gnu11 -O1 -Isrc src/js.c tests/p6_arm_target.c -lm -pthread -o /tmp/p6-arm-target && /tmp/p6-arm-target
          C_INCLUDE_PATH=/usr/include/SDL2 bash tests/fontecache.sh
          C_INCLUDE_PATH=/usr/include/SDL2 bash tests/fontevolta.sh
          bash tests/legextras.sh
          bash tests/p6_account_pull.sh
          # Actual history dispatch/retry test uses mock HTTP, never external calls.
          C_INCLUDE_PATH=/usr/include/SDL2 bash tests/visto.sh
          bash tests/postplay_p6_integration.sh

      - name: Install Android API 35 (no NDK build or APK)
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Resolve existing app Kotlin and Media3 dependencies (no APK)
        shell: bash
        run: |
          set -euo pipefail
          bash android/gradlew -p android :app:dependencies --configuration debugCompileClasspath --no-daemon > "$RUNNER_TEMP/p4-deps.log" 2>&1 || {
            tail -n 110 "$RUNNER_TEMP/p4-deps.log"
            exit 1
          }
          echo 'Gradle production dependencies resolved'
          grep -E 'media3-(exoplayer|datasource):1\.8\.0' "$RUNNER_TEMP/p4-deps.log" | head -n 8 || true

      - name: Compile actual Activity and complete app Kotlin source (no APK)
        shell: bash
        run: |
          set -euo pipefail
          # Same exact SDL version as tools/android.sh. No native SDK build.
          mkdir -p "$HOME/.cache/nuvio-android/src"
          curl -fsSL --retry 3 https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz -C "$HOME/.cache/nuvio-android/src"
          test -f "$HOME/.cache/nuvio-android/src/SDL2-2.30.9/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java"
          g=(bash android/gradlew -p android :app:compileDebugKotlin --no-daemon)
          "${g[@]}" --dry-run | tee "$RUNNER_TEMP/p6-kotlin-graph.log"
          # Check task graph before any compilation. Never assemble/package an APK
          # or invoke external native builds in this test-only workflow.
          # AGP resource packaging is a compile prerequisite, not APK packaging.
          # Exempt only this exact resource task; retain the fail-closed APK/native guard.
          if grep -Ei '^:[^ ]*:(assemble[^ ]*|package(Debug|Release)([^ ]*)?|bundle[^ ]*|sign[^ ]*|install(Debug|Release)|externalNativeBuild[^ ]*|buildCMake[^ ]*|configureCMake[^ ]*) SKIPPED' "$RUNNER_TEMP/p6-kotlin-graph.log" | grep -Fxv ':app:packageDebugResources SKIPPED'; then
            echo '::error::Unexpected APK/native build task; refusing to run.'
            exit 1
          fi
          "${g[@]}"
          test -z "$(find android/app/build -type f -name '*.apk' -print -quit)"
          echo 'Full production Kotlin source including actual NuvioActivity and SDL bridge: PASS'

      - name: Resolve pinned AndroidX harness JARs absent from default app graph
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/p4-test-deps"
          mkdir -p "$deps"
          printf "rootProject.name='p4-test-deps'\n" > "$deps/settings.gradle"
          cat > "$deps/build.gradle" <<'GRADLE'
          repositories { google(); mavenCentral() }
          configurations { p4TestOnly; p4KotlinTools }
          configurations.p4KotlinTools.attributes.attribute(
            org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
            objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, 'standard-jvm')
          )
          // Guava publishes Android and JRE variants; select Android explicitly.
          configurations.p4TestOnly.attributes.attribute(
            org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
            objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, 'android')
          )
          dependencies {
            // The existing cacheboost_android.py requires all these exact 1.8.0 AARs.
            p4TestOnly 'androidx.media3:media3-common:1.8.0'
            p4TestOnly 'androidx.media3:media3-datasource:1.8.0'
            p4TestOnly 'androidx.media3:media3-exoplayer:1.8.0'
            p4TestOnly 'androidx.media3:media3-exoplayer-hls:1.8.0'
            p4TestOnly 'androidx.media3:media3-decoder:1.8.0'
            p4TestOnly 'androidx.media3:media3-extractor:1.8.0'
            p4TestOnly 'androidx.media3:media3-container:1.8.0'
            p4TestOnly 'androidx.media3:media3-database:1.8.0'
            p4TestOnly 'androidx.core:core:1.13.1'
            p4TestOnly 'androidx.annotation:annotation-jvm:1.6.0'
            p4TestOnly 'androidx.annotation:annotation-experimental:1.4.0'
            p4TestOnly 'com.google.guava:guava:33.3.1-android'
            p4KotlinTools 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
            p4KotlinTools 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21'
            p4KotlinTools 'org.jetbrains.kotlin:kotlin-script-runtime:2.0.21'
          }
          tasks.register('resolveP4') {
            doLast {
              configurations.p4TestOnly.files.each { println "Android test dependency: " + it.name }
              configurations.p4KotlinTools.files.each { println "Host compiler dependency: " + it.name }
            }
          }
          GRADLE
          bash android/gradlew -p "$deps" resolveP4 --no-daemon

      - name: Compile real Android Media3 sources and replay live DSP, downmix and adapted HEVC
        shell: bash
        env:
          NUVIO_TEST_JAVA: java
          NUVIO_CACHE_COMPILE_ONLY: '0'
        run: |
          set -euo pipefail
          NUVIO_ANDROID_CACHE="$RUNNER_TEMP/p6-isolated-harness" python3 tests/cacheboost_android.py

      - name: Execute production audio, HDR, AFR and surface transition policies
        shell: bash
        run: |
          set -euo pipefail
          if command -v kotlinc >/dev/null 2>&1; then
            bash tests/playback_p6.sh
            bash tests/p5_audio_fidelity.sh
            bash tests/p5_audio_route.sh
            python3 tests/p5d_route_source_contract.py
            bash tests/p5_hdr_policy.sh
            bash tests/p5_afr.sh
            bash tests/p5_surface_transition.sh
            bash tests/playback_p2_frame_policy.sh
          else
            echo '::warning::kotlinc CLI not installed on this runner; actual full Kotlin+Media3 compile and PCM replay already executed above.'
            exit 1
          fi

      - name: Test-only scope summary
        if: always()
        shell: bash
        run: |
          echo "### P6 lifecycle and post-play test-only source verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: P6 one-shot task restoration, exact source and track proof, full-width progress, 127-byte stream targets, rejection boundaries and title-local episode identity, duplicate lifecycle and bounded source matching, identity-checked resume UI, full production Kotlin Activity compile, detached preload ownership, lifecycle, unique-viewed-interval, actual resume and post-play policies; chapter provenance, profile journal and resume proof; earlier audio and first-frame regressions, ARM64 C/JNI syntax, API35/Media3 Kotlin compile, actual PCM replay, HDR/error, AFR and surface policies." >> "$GITHUB_STEP_SUMMARY"
          echo "NO APK assembled, packaged, signed, uploaded or published. No master merge, secrets or release." >> "$GITHUB_STEP_SUMMARY"
          echo "Physical display modes, Dolby Vision and HDMI ARC/codec output are NOT proven by this source/test-only job." >> "$GITHUB_STEP_SUMMARY"
# P8 Phase A: verify refreshed PCM channel/rate configuration on stable route changes.

# P8 Phase B: integrated source gate after UI and badge changes.

# P8 Phase B final fixture and focus-clip correction, exact revision.
