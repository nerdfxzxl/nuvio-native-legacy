name: P7 Android link and legacy integration
on:
  workflow_dispatch:
  push:
    branches: [feature/official-stream-selector]
    paths: [.github/workflows/p7-integration.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: 'aarch64-linux-android,armv7-linux-androideabi'}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nuvio-android-cache/src
            ${{ runner.temp }}/nuvio-android-cache/prefix
            ${{ runner.temp }}/nuvio-android-cache/media3-ffmpeg
          key: native-android-r27c-v1-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh', 'tools/android.sh') }}
          restore-keys: native-android-r27c-v1-
      - id: engine
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nuvio-p2p-motor/android/lib
            ${{ runner.temp }}/nuvio-p2p-motor/android/include
          key: p2p-r27c-v1-${{ hashFiles('tools/p2p-motor/pasta.sh', 'tools/p2p-motor/build-android.sh', 'tools/p2p-motor/janela-334.patch') }}
      - name: Prepare production dependencies
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "NUVIO_ANDROID_CACHE=$RUNNER_TEMP/nuvio-android-cache" >> "$GITHUB_ENV"
          echo "NUVIO_P2P_MOTOR=$RUNNER_TEMP/nuvio-p2p-motor" >> "$GITHUB_ENV"
      - if: steps.engine.outputs.cache-hit != 'true'
        run: bash tools/p2p-motor/build-android.sh "$NUVIO_P2P_MOTOR/android"
      - run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
      - name: Link full ARM64 libmain and compile production Kotlin and Java
        run: |
          bash tools/android.sh --verify-link
          elf=$(find android/app/build/intermediates/cxx -path '*/arm64-v8a/libmain.so' -print -quit)
          test -s "$elf"
          readelf -h "$elf" | grep 'Machine:.*AArch64'
          readelf -d "$elf" | grep 'NEEDED.*libSDL2.so'
          nm -D --defined-only "$elf" > "$RUNNER_TEMP/main.symbols"
          grep ' SDL_main$' "$RUNNER_TEMP/main.symbols"
          grep ' Java_space_nuvio_nativelegacy_NvPlayer_nativeEvento$' "$RUNNER_TEMP/main.symbols"
          grep ' nv_mkvcore_achar_tracks
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        suites:
          - addons_alvo_pendente addons_stream_pending fonte_manual_resume playback_p3_reload
          - posplay posplay_recuo proxprefetch postplay_p6_integration proximo
          - player_eof_episodios player_visto_trailer player_scrobble_trailer
          - player player_republica player_retido player_back
          - catalog_episode_identity512 episode_identity512 player_identity524 cw_stats_identity524 visto_identidade512
          - addons_legendas legendasui stream_parser fileiras
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 sdl2_image sdl2_ttf ripgrep
      - name: Execute each original suite and retain individual results
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          failed=0
          for suite in $SUITES; do
            echo "::group::$suite"
            if bash "tests/$suite.sh"; then
              echo "$suite passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$suite failed"
              echo "$suite failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
 "$RUNNER_TEMP/main.symbols"
          strings "$elf" > "$RUNNER_TEMP/main.strings"
          grep 'Nuvio Engine/' "$RUNNER_TEMP/main.strings"
          python3 tests/p7_jni_contract.py android/app/build "$RUNNER_TEMP/main.symbols"
          test -z "$(find android/app/build -name '*.apk' -print -quit)"
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install host SDL and native test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev ripgrep
      - name: Production callback race and post-134 contracts
        run: |
          failed=0
          for check in 'bash tests/p7_callback_ownership.sh' 'python3 tests/player_home_polish_134.py' 'python3 tests/player_panel_131_contract.py' 'bash tests/catalog_episode_identity512.sh' 'bash tests/postplay_p6_integration.sh'; do
            echo "::group::$check"
            if bash -c "$check"; then
              echo "$check passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$check failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
  legacy:
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        suites:
          - addons_alvo_pendente addons_stream_pending fonte_manual_resume playback_p3_reload
          - posplay posplay_recuo proxprefetch postplay_p6_integration proximo
          - player_eof_episodios player_visto_trailer player_scrobble_trailer
          - player player_republica player_retido player_back
          - catalog_episode_identity512 episode_identity512 player_identity524 cw_stats_identity524 visto_identidade512
          - addons_legendas legendasui stream_parser fileiras
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 sdl2_image sdl2_ttf ripgrep
      - name: Execute each original suite and retain individual results
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          failed=0
          for suite in $SUITES; do
            echo "::group::$suite"
            if bash "tests/$suite.sh"; then
              echo "$suite passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$suite failed"
              echo "$suite failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
