name: Netflix native preflight (no APK)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/official-stream-selector
    paths:
      - docs/ci/trigger-netflix-native-preflight.txt

permissions:
  contents: read

jobs:
  syntax:
    name: Validate changed Android C before full APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and SDL headers
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Check all changed Android C translation units
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          bash tools/android/preflight-c.sh
      - name: Verify Netflix integration and settings indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/detail_netflix.py
          bash tests/ajustes_secoes.sh
