name: P4 cache verification (tests only - no APK)

# Dedicated push trigger; existing APK workflow paths are left untouched.
# Playback recovery verifies representation identity, RAM profiles and the cache adapter.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/official-stream-selector
    paths:
      - .github/workflows/p4-cache-test-only.yml
      - tests/p4_cache_ci_policy.py
      - tests/playback_p4_vod.py

permissions:
  contents: read

concurrency:
  group: p4-cache-test-only-feature-branch
  cancel-in-progress: true

jobs:
  verify:
    name: API35 / Media3 source compilation and P4 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify P4-C source contracts and VOD buffer regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/playback_p4c_source_contract.py
          python3 tests/playback_p4_vod.py

      - name: Install Android API 35 (no NDK build or APK)
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Resolve existing app Kotlin and Media3 dependencies (no APK)
        shell: bash
        run: |
          set -euo pipefail
          bash android/gradlew -p android :app:dependencies --configuration debugCompileClasspath --no-daemon > "$RUNNER_TEMP/p4-deps.log" 2>&1 || {
            tail -n 110 "$RUNNER_TEMP/p4-deps.log"
            exit 1
          }
          echo 'Gradle production dependencies resolved'
          grep -E 'media3-(exoplayer|datasource):1\.8\.0' "$RUNNER_TEMP/p4-deps.log" | head -n 8 || true

      - name: Resolve pinned AndroidX harness JARs absent from default app graph
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/p4-test-deps"
          mkdir -p "$deps"
          printf "rootProject.name='p4-test-deps'\n" > "$deps/settings.gradle"
          cat > "$deps/build.gradle" <<'GRADLE'
          repositories { google(); mavenCentral() }
          configurations { p4TestOnly; p4KotlinTools }
          configurations.p4KotlinTools.attributes.attribute(
            org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
            objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, 'standard-jvm')
          )
          // Guava publishes Android and JRE variants; select Android explicitly.
          configurations.p4TestOnly.attributes.attribute(
            org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
            objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, 'android')
          )
          dependencies {
            // The existing cacheboost_android.py requires all these exact 1.8.0 AARs.
            p4TestOnly 'androidx.media3:media3-common:1.8.0'
            p4TestOnly 'androidx.media3:media3-datasource:1.8.0'
            p4TestOnly 'androidx.media3:media3-exoplayer:1.8.0'
            p4TestOnly 'androidx.media3:media3-exoplayer-hls:1.8.0'
            p4TestOnly 'androidx.media3:media3-decoder:1.8.0'
            p4TestOnly 'androidx.media3:media3-extractor:1.8.0'
            p4TestOnly 'androidx.media3:media3-container:1.8.0'
            p4TestOnly 'androidx.media3:media3-database:1.8.0'
            p4TestOnly 'androidx.core:core:1.13.1'
            p4TestOnly 'androidx.annotation:annotation-jvm:1.6.0'
            p4TestOnly 'androidx.annotation:annotation-experimental:1.4.0'
            p4TestOnly 'com.google.guava:guava:33.3.1-android'
            p4KotlinTools 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
            p4KotlinTools 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21'
            p4KotlinTools 'org.jetbrains.kotlin:kotlin-script-runtime:2.0.21'
          }
          tasks.register('resolveP4') {
            doLast {
              configurations.p4TestOnly.files.each { println "Android test dependency: " + it.name }
              configurations.p4KotlinTools.files.each { println "Host compiler dependency: " + it.name }
            }
          }
          GRADLE
          bash android/gradlew -p "$deps" resolveP4 --no-daemon

      - name: Compile actual cache/player source against API35 and Media3 (no APK)
        shell: bash
        env:
          NUVIO_TEST_JAVA: java
          NUVIO_CACHE_COMPILE_ONLY: '1'
        run: |
          set -euo pipefail
          python3 tests/cacheboost_android.py

      - name: Execute production Kotlin provenance, real disk corruption and session tests
        shell: bash
        env:
          NUVIO_TEST_JAVA: java
        run: |
          set -euo pipefail
          python3 tests/p4_cache_ci_policy.py

      - name: Run actual Media3 CacheDataSource integration under Robolectric
        shell: bash
        run: |
          set -euo pipefail
          target="tests/p4-cache-integration/src/production/kotlin"
          mkdir -p "$target"
          for file in CacheMidia.kt CacheSessao.kt CacheProvaP4C.kt CacheSpanP4C.kt; do
            cp "android/app/src/main/java/space/nuvio/nativelegacy/$file" "$target/$file"
          done
          bash android/gradlew -p tests/p4-cache-integration testDebugUnitTest --no-daemon --console=plain

      - name: Test-only scope summary
        if: always()
        shell: bash
        run: |
          echo "### P4-C test-only verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No APK assembled, packaged, signed, uploaded, or published." >> "$GITHUB_STEP_SUMMARY"
          echo "Green checks verify source contracts, targeted API35/Media3 production-source compilation, and host Kotlin tests only." >> "$GITHUB_STEP_SUMMARY"
          echo "Integrated Media3 cache/HTTP cancellation, eviction and runtime TV checks remain separately gated." >> "$GITHUB_STEP_SUMMARY"

# APK 138 protected TV baseline: isolated mobile decoder/startup regression verification.

# Sweet Max unsupported-subtype follow-up: verify clear-base hardware trial and rejection diagnostics.
