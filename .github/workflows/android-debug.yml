name: Android APK (debug)

on:
  # One tightly scoped integration build. The one-shot push trigger is removed
  # immediately after the artifact is verified; normal pushes never build.
  workflow_dispatch:
  push:
    branches:
      - feature/official-stream-selector
    paths:
      - docs/ci/trigger-netflix-detail-once.txt

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate ALL inexpensive checks, including real artwork staging, before native dependencies/P2P.
  preflight:
    name: Early Android C and asset validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and SDL development headers
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update -qq
          # Lightweight Pillow converts artwork without installing FFmpeg's
          # 87-package media stack on each new GitHub runner.
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev python3-pil

      - name: Compile-check updated native UI files (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          bash tools/android/preflight-c.sh
          bash -n tools/tizen-art.sh tools/android.sh
          bash tests/stream_parser.sh
          bash tests/selospacote.sh
          bash tests/celular.sh
          bash tests/detail_acoes_gap.sh

      - name: Stage and validate Android artwork before native dependencies or P2P
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'from PIL import Image, features; assert features.check("webp")' || { echo '::error::Host Pillow with WebP support missing'; exit 1; }
          stage="$RUNNER_TEMP/nuvio-android-art-preflight"
          NUVIO_BADGE_PNG_HEIGHT=192 NUVIO_ARTE_ESTAGIO="$stage" bash tools/tizen-art.sh >/dev/null
          test -s "$stage/badges/index.json"
          test -n "$(find "$stage" -type f -name '*.png' -print -quit)"
          test -z "$(find "$stage" -type f -name '*.webp' -print -quit)"
          echo 'Android artwork conversion and asset checks: passed'

      - name: Cache Gradle dependencies for early Android graphics tests
        uses: gradle/actions/setup-gradle@v4

      - name: Check stream-card wrapping and color emoji with Android graphics
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          android/gradlew -p tests/android-card -Pandroid.useAndroidX=true testDebugUnitTest

  build:
    name: Build full Android debug APK
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle wrapper and downloaded dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android build components and host tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          # The SDK already supplies Ninja and CMake 3.22 for Android libs.
          # P2P requires HOST CMake >=3.24. Badge conversion uses small
          # system Pillow; Android FFmpeg JNI is built independently.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil
          /usr/bin/python3 -c 'from PIL import Image, features; assert features.check("webp")' || { echo '::error::Host Pillow/WebP missing before P2P'; exit 1; }
          installed="$(cmake --version 2>/dev/null | awk 'NR==1 {print $3}' || true)"
          if [[ -z "$installed" ]] || [[ "$(printf '%s\n' "$installed" "3.24.0" | sort -V | head -n 1)" != "3.24.0" ]]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake
          fi
          for tool in cmake perl python3 make git unzip; do
            command -v "$tool" >/dev/null || { echo "::error::Missing host tool: $tool"; exit 1; }
          done
          cmake --version | head -1
          echo "SDK Ninja: $ANDROID_HOME/cmake/3.22.1/bin/ninja"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/ninja"

      - name: Restore persistent debug signing identity (optional)
        shell: bash
        env:
          NUVIO_DEBUG_KEYSTORE_BASE64: ${{ secrets.NUVIO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$NUVIO_DEBUG_KEYSTORE_BASE64" ]]; then
            target="$RUNNER_TEMP/nuvio-debug.jks"
            printf '%s' "$NUVIO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$target"
            chmod 600 "$target"
            keytool -list -keystore "$target" -storepass android -alias nuvio-debug >/dev/null
            echo "NUVIO_DEBUG_KEYSTORE=$target" >> "$GITHUB_ENV"
            echo "Using persistent CI debug signing identity"
          else
            echo "::warning::No NUVIO_DEBUG_KEYSTORE_BASE64 configured; Gradle uses an ephemeral debug key"
          fi

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Verify required login configuration
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL }}
          # Optional metadata integrations: absent secrets yield explicit
          # unavailable states, not fatal builds or fabricated ratings/reviews.
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${NUVIO_SUPABASE_URL//[[:space:]]/}" ]] || missing+=(NUVIO_SUPABASE_URL)
          [[ -n "${NUVIO_SUPABASE_ANON_KEY//[[:space:]]/}" ]] || missing+=(NUVIO_SUPABASE_ANON_KEY)
          [[ -n "${TV_LOGIN_WEB_BASE_URL//[[:space:]]/}" ]] || missing+=(TV_LOGIN_WEB_BASE_URL)
          if (( ${#missing[@]} )); then
            printf '::error::Missing repository Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          umask 077
          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_SUPABASE_URL"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_ANON_KEY"
            printf 'TV_LOGIN_WEB_BASE_URL=%s\n' "$TV_LOGIN_WEB_BASE_URL"
            printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
          } > local.properties
          if [[ -z "$TRAKT_CLIENT_ID" ]]; then
            echo "::warning::TRAKT_CLIENT_ID not configured: public Trakt title reviews and season ratings may be unavailable"
          fi
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "::warning::TMDB_API_KEY not configured: richer Details and episode metadata may be incomplete"
          fi
          chmod 600 local.properties

      # Cache native outputs and pinned source downloads across runner rebuilds.
      # This also preserves the custom 16-KB-page FFmpeg JNI between APK runs.
      - name: Restore native Android dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nuvio-android-cache/src
            ${{ runner.temp }}/nuvio-android-cache/prefix
            ${{ runner.temp }}/nuvio-android-cache/media3-ffmpeg
          key: native-android-r27c-v1-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh', 'tools/android.sh') }}

      - name: Build native curl, JPEG and WebP libraries
        shell: bash
        env:
          NUVIO_ANDROID_CACHE: ${{ runner.temp }}/nuvio-android-cache
          NUVIO_ANDROID_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/deps.sh arm64-v8a armeabi-v7a

      # Motor output is self-contained (two ABIs + headers) and pinned to a
      # specific nuvio-engine commit in pasta.sh. Cached hit skips ~7 minutes.
      - name: Restore P2P engine libraries
        id: p2p-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/nuvio-p2p-motor/android/lib
            ${{ runner.temp }}/nuvio-p2p-motor/android/include
          key: p2p-r27c-v1-${{ hashFiles('tools/p2p-motor/pasta.sh', 'tools/p2p-motor/build-android.sh', 'tools/p2p-motor/janela-334.patch') }}

      - name: Build the P2P engine for both Android ABIs
        if: steps.p2p-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          NUVIO_P2P_MOTOR: ${{ runner.temp }}/nuvio-p2p-motor
          NV_JOBS: '2'
          NUVIO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/p2p-motor/build-android.sh "$NUVIO_P2P_MOTOR/android"

      # Save the successful P2P output immediately. A later Gradle/asset error
      # must not force another costly engine build on the next attempt.
      - name: Save completed P2P engine for retries
        if: steps.p2p-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/nuvio-p2p-motor/android/lib
            ${{ runner.temp }}/nuvio-p2p-motor/android/include
          key: p2p-r27c-v1-${{ hashFiles('tools/p2p-motor/pasta.sh', 'tools/p2p-motor/build-android.sh', 'tools/p2p-motor/janela-334.patch') }}

      - name: Build full APK with login configuration
        shell: bash
        env:
          NUVIO_P2P_MOTOR: ${{ runner.temp }}/nuvio-p2p-motor
          NUVIO_ANDROID_CACHE: ${{ runner.temp }}/nuvio-android-cache
          NUVIO_REQUIRE_CORE: '1'
          NUVIO_ANDROID_JOBS: '2'
          NUVIO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$NUVIO_ANDROID_CACHE"
          bash tools/android.sh --debug-only

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-native-legacy-android-debug
          path: build/android/*-android-debug.apk
          if-no-files-found: error
          retention-days: 14
