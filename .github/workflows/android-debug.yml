name: Android APK (debug)

on:
  # One tightly scoped integration build. The one-shot push trigger is removed
  # immediately after the artifact is verified; normal pushes never build.
  workflow_dispatch:
  push:
    branches:
      - feature/official-stream-selector
    paths:
      - docs/ci/trigger-netflix-detail-once.txt

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual full builds first run this validation gate. No push-triggered CI.
  preflight:
    name: Early Android C compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and SDL development headers
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Compile-check updated native UI files (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          bash tools/android/preflight-c.sh
          bash -n tools/tizen-art.sh tools/android.sh
          bash tests/stream_parser.sh
          bash tests/selospacote.sh
          bash tests/celular.sh
          bash tests/detail_acoes_gap.sh

      - name: Check stream-card wrapping and color emoji with Android graphics
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          android/gradlew -p tests/android-card -Pandroid.useAndroidX=true testDebugUnitTest

  build:
    name: Build full Android debug APK
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components and host tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ffmpeg perl python3

      - name: Restore persistent debug signing identity (optional)
        shell: bash
        env:
          NUVIO_DEBUG_KEYSTORE_BASE64: ${{ secrets.NUVIO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$NUVIO_DEBUG_KEYSTORE_BASE64" ]]; then
            target="$RUNNER_TEMP/nuvio-debug.jks"
            printf '%s' "$NUVIO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$target"
            chmod 600 "$target"
            keytool -list -keystore "$target" -storepass android -alias nuvio-debug >/dev/null
            echo "NUVIO_DEBUG_KEYSTORE=$target" >> "$GITHUB_ENV"
            echo "Using persistent CI debug signing identity"
          else
            echo "::warning::No NUVIO_DEBUG_KEYSTORE_BASE64 configured; Gradle uses an ephemeral debug key"
          fi

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Verify required login configuration
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL }}
          # Optional metadata integrations: absent secrets yield explicit
          # unavailable states, not fatal builds or fabricated ratings/reviews.
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${NUVIO_SUPABASE_URL//[[:space:]]/}" ]] || missing+=(NUVIO_SUPABASE_URL)
          [[ -n "${NUVIO_SUPABASE_ANON_KEY//[[:space:]]/}" ]] || missing+=(NUVIO_SUPABASE_ANON_KEY)
          [[ -n "${TV_LOGIN_WEB_BASE_URL//[[:space:]]/}" ]] || missing+=(TV_LOGIN_WEB_BASE_URL)
          if (( ${#missing[@]} )); then
            printf '::error::Missing repository Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          umask 077
          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_SUPABASE_URL"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_ANON_KEY"
            printf 'TV_LOGIN_WEB_BASE_URL=%s\n' "$TV_LOGIN_WEB_BASE_URL"
            printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
          } > local.properties
          if [[ -z "$TRAKT_CLIENT_ID" ]]; then
            echo "::warning::TRAKT_CLIENT_ID not configured: public Trakt title reviews and season ratings may be unavailable"
          fi
          if [[ -z "$TMDB_API_KEY" ]]; then
            echo "::warning::TMDB_API_KEY not configured: richer Details and episode metadata may be incomplete"
          fi
          chmod 600 local.properties

      - name: Build native curl, JPEG and WebP libraries
        shell: bash
        env:
          NUVIO_ANDROID_CACHE: ${{ runner.temp }}/nuvio-android-cache
          NUVIO_ANDROID_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/deps.sh arm64-v8a armeabi-v7a

      - name: Build the P2P engine for both Android ABIs
        shell: bash
        env:
          NUVIO_P2P_MOTOR: ${{ runner.temp }}/nuvio-p2p-motor
          NV_JOBS: '2'
          NUVIO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/p2p-motor/build-android.sh "$NUVIO_P2P_MOTOR/android"

      - name: Build full APK with login configuration
        shell: bash
        env:
          NUVIO_P2P_MOTOR: ${{ runner.temp }}/nuvio-p2p-motor
          NUVIO_ANDROID_CACHE: ${{ runner.temp }}/nuvio-android-cache
          NUVIO_REQUIRE_CORE: '1'
          NUVIO_ANDROID_JOBS: '2'
          NUVIO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$NUVIO_ANDROID_CACHE"
          bash tools/android.sh --debug-only

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-native-legacy-android-debug
          path: build/android/*-android-debug.apk
          if-no-files-found: error
          retention-days: 14
