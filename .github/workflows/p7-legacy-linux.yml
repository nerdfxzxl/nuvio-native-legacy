name: P7 Linux legacy regressions (tests only - no APK)
on:
  workflow_dispatch:
  push:
    branches: [feature/official-stream-selector]
    paths: [.github/workflows/p7-legacy-linux.yml]
# CI #11: final Q46 diagnostics provenance correction and full regression.
concurrency:
  group: p7-linux-legacy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suites:
          - addons_alvo_pendente addons_stream_pending fonte_manual_resume playback_p3_reload playback_diag_p7 p7_join_workers estatvivo
          - posplay posplay_recuo proxprefetch postplay_p6_integration proximo
          - player_eof_episodios player_visto_trailer player_scrobble_trailer
          - player player_republica player_retido player_back videoerro_p5b audioerro_p5a playback_p2d_handoff
          - catalog_episode_identity512 episode_identity512 player_identity524 cw_stats_identity524 visto_identidade512
          - addons_legendas legendasui stream_parser fileiras
    steps:
      - uses: actions/checkout@v4
      - name: Install native Linux desktop test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles-dev libegl-dev zlib1g-dev ripgrep
          pkg-config --exists sdl2 SDL2_image SDL2_ttf glesv2 egl zlib
      - name: Set up test-only compiler adapter
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/p7-bin"
          ln -s "$GITHUB_WORKSPACE/tests/p7_linux_cc.py" "$RUNNER_TEMP/p7-bin/cc"
          echo "P7_REAL_CC=$(command -v clang)" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/p7-bin" >> "$GITHUB_PATH"
      - name: Run legacy suites and focused diagnostics with sanitizer-output gate
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          failed=0
          for suite in $SUITES; do
            echo "::group::$suite"
            export P7_FULL_APP=0
            export P7_ASAN=0
            # ASan instruments all translation units in the crash-prone full-app
            # harnesses, including split objects. Preserve the original exit code.
            case "$suite" in posplay|posplay_recuo|fonte_manual_resume|player_republica|player_eof_episodios|player_visto_trailer|player_scrobble_trailer) export P7_ASAN=1 ;; esac
            export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1:symbolize=1:fast_unwind_on_fatal=0
            export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
            if command -v llvm-symbolizer >/dev/null; then export ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)"; fi
            export SDL_VIDEODRIVER=dummy
            export SDL_AUDIODRIVER=dummy
            export TMPDIR="$RUNNER_TEMP/p7-tmp-$suite"
            mkdir -p "$TMPDIR"
            case "$suite" in
              addons_alvo_pendente|fonte_manual_resume|posplay|posplay_recuo|player_eof_episodios|player_visto_trailer|player_scrobble_trailer|player|player_republica|player_retido|player_back|player_identity524) export P7_FULL_APP=1 ;;
            esac
            export NUVIO_DADOS="$RUNNER_TEMP/p7-data-$suite"
            mkdir -p "$NUVIO_DADOS"
            if bash tests/p7_run_suite.sh bash "tests/$suite.sh"; then
              echo "$suite PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              rc=$?
              echo "::error::$suite failed (exit $rc)"
              echo "$suite FAIL (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
# P8 Phase A: verify refreshed PCM channel/rate configuration on stable route changes.
